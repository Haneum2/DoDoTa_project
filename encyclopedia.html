<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <script>(function(){var t=localStorage.getItem('ddTownTheme');if(t==='dark'||(!t&&window.matchMedia('(prefers-color-scheme: dark)').matches))document.documentElement.setAttribute('data-theme','dark');})()</script>
    <title>실시간 도감 - 두근두근타운</title>
    <link rel="icon" href="favicon.svg" type="image/svg+xml">
    <link rel="stylesheet" href="css/style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Gamja+Flower&family=Jua&display=swap" rel="stylesheet">
</head>

<body>
    <header>
        <div class="header-top-row">
            <a href="index.html" class="back-btn">← 홈으로</a>
            <div id="auth-status"></div>
        </div>
        <h1>🐟🐞 실시간 도감</h1>
        <div id="real-time-clock" class="clock-display">
            로딩 중...
        </div>
        <div class="filter-section">
            <div class="search-bar">
                <input type="text" id="search-input" placeholder="🔍 도감 이름 검색..." oninput="setSearch(this.value)">
            </div>
            <div class="weather-controls">
                <button class="weather-btn active" data-weather="sunny" onclick="setWeather('sunny')">☀️ 맑음</button>
                <button class="weather-btn" data-weather="rainbow" onclick="setWeather('rainbow')">🌈 무지개</button>
                <button class="weather-btn" data-weather="rainy" onclick="setWeather('rainy')">🌧️ 비</button>
            </div>

            <div class="category-controls" style="margin-top: 15px;">
                <button class="cat-btn active" data-type="all" onclick="setCategory('all')">전체</button>
                <button class="cat-btn" data-type="insect" onclick="setCategory('insect')">🐞 곤충</button>
                <button class="cat-btn" data-type="fish" onclick="setCategory('fish')">🐟 물고기</button>
                <button class="cat-btn" data-type="bird" onclick="setCategory('bird')">🐦 조류</button>
            </div>

            <div class="hide-settings" style="margin-top: 15px; text-align: center; display: flex; justify-content: center; gap: 16px; flex-wrap: wrap;">
                <label style="cursor: pointer; font-size: 0.9rem; color: #666;">
                    <input type="checkbox" id="hide-checked-checkbox" onchange="toggleHideChecked(this.checked)">
                    ✅ 수집 완료한 카드 가리기
                </label>
                <label style="cursor: pointer; font-size: 0.9rem; color: #666;">
                    <input type="checkbox" id="show-season-checkbox" onchange="toggleSeasonOnly(this.checked)">
                    ✨ 시즌 한정만 보기
                </label>
            </div>
        </div>
    </header>

    <main id="item-list" class="grid-container"></main>

    <!-- ===== 아이템 상세 패널 ===== -->
    <div id="item-detail-overlay" class="item-detail-overlay" style="display:none;">
        <div class="item-detail-panel">
            <button class="item-detail-back" onclick="closeItemDetail()">← 뒤로</button>
            <div id="item-detail-content"></div>
        </div>
    </div>

    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
    <script src="js/firebase.js"></script>
    <script src="js/auth-ui.js"></script>
    <script src="js/profile-ui.js"></script>
    <script src="js/main.js"></script>
    <script src="js/theme.js"></script>
    <script src="js/cursor-effects.js"></script>
</body>
</html>
