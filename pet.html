<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>펫 먹이 체크리스트 - 두근두근타운</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Gamja+Flower&display=swap" rel="stylesheet">
    <style>
        @font-face {
            font-family: 'GanaChocolate';
            src: url('https://fastly.jsdelivr.net/gh/projectnoonnu/noonfonts_20-04@1.0/GanaChocolate.woff') format('woff');
            font-weight: normal;
            font-style: normal;
        }
        @font-face {
            font-family: 'NanumSquareRound';
            src: url('https://fastly.jsdelivr.net/gh/projectnoonnu/noonfonts_two@1.0/NanumSquareRound.woff') format('woff');
            font-weight: normal;
            font-style: normal;
        }
    </style>
</head>

<body>
    <!-- ===== 헤더 ===== -->
    <header>
        <a href="index.html" class="back-btn">← 홈으로</a>
        <h1>🐾 펫 먹이 체크리스트</h1>
    </header>

    <!-- ===== 뷰 1: 펫 목록 ===== -->
    <div id="view-list">
        <div class="pet-add-bar">
            <button class="add-pet-btn cat" onclick="openModal('cat')">🐱 고양이 추가</button>
            <button class="add-pet-btn dog" onclick="openModal('dog')">🐶 강아지 추가</button>
        </div>
        <div id="pet-list-grid" class="pet-grid"></div>
    </div>

    <!-- ===== 뷰 2: 펫 상세 (먹이 체크리스트) ===== -->
    <div id="view-detail" style="display:none;">
        <div class="detail-top">
            <button class="back-to-list-btn" onclick="showListView()">← 목록으로</button>
            <div class="detail-pet-header">
                <!-- 사진 영역: JS가 렌더링 -->
                <div id="detail-photo-area" class="detail-photo-area" onclick="triggerDetailPhotoUpload()">
                    <div class="photo-edit-overlay">📷</div>
                </div>
                <div>
                    <h2 id="detail-pet-name"></h2>
                    <p id="detail-summary" class="progress-display"></p>
                </div>
            </div>
        </div>

        <!-- 상태 필터 -->
        <div class="status-filter">
            <button class="sfil-btn active" data-status="all"      onclick="setStatusFilter('all')">전체</button>
            <button class="sfil-btn"        data-status="none"     onclick="setStatusFilter('none')">⬜ 보통</button>
            <button class="sfil-btn"        data-status="favorite" onclick="setStatusFilter('favorite')">❤️ 좋아함</button>
            <button class="sfil-btn"        data-status="dislike"  onclick="setStatusFilter('dislike')">👎 싫어함</button>
            <button class="sfil-btn"        data-status="full"     onclick="setStatusFilter('full')">🍽️ 배불림</button>
        </div>

        <main id="detail-food-list" class="grid-container"></main>
    </div>

    <!-- ===== 모달: 펫 추가 ===== -->
    <div id="add-pet-modal" class="modal-overlay" style="display:none;" onclick="handleOverlayClick(event)">
        <div class="modal-box">
            <h3>새 펫 추가</h3>
            <div class="modal-type-select">
                <button class="type-btn active" id="type-btn-cat" onclick="selectPetType('cat')">🐱 고양이</button>
                <button class="type-btn"        id="type-btn-dog" onclick="selectPetType('dog')">🐶 강아지</button>
            </div>
            <input type="text" id="pet-name-input" placeholder="이름을 입력하세요" maxlength="10">
            <div class="modal-actions">
                <button class="modal-cancel"  onclick="closeModal()">취소</button>
                <button class="modal-confirm" onclick="confirmAddPet()">추가하기</button>
            </div>
        </div>
    </div>

    <!-- 숨김 파일 입력 (사진 업로드용) -->
    <input type="file" id="photo-upload-input" accept="image/*" style="display:none" onchange="handlePhotoUpload(event)">

    <!-- 토스트 알림 -->
    <div id="toast" class="toast"></div>

    <script src="js/pet.js"></script>
</body>
</html>
