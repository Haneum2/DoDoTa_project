<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <script>(function(){var t=localStorage.getItem('ddTownTheme');if(t==='dark'||(!t&&window.matchMedia('(prefers-color-scheme: dark)').matches))document.documentElement.setAttribute('data-theme','dark');})()</script>
    <title>펫 먹이 체크리스트 - 두근두근타운</title>
    <link rel="icon" href="favicon.svg" type="image/svg+xml">
    <link rel="stylesheet" href="css/style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Gamja+Flower&family=Jua&display=swap" rel="stylesheet">
</head>

<body>
    <!-- ===== 헤더 ===== -->
    <header>
        <div class="header-top-row">
            <a href="index.html" class="back-btn">← 홈으로</a>
            <div id="auth-status"></div>
        </div>
        <h1>🐾 펫 먹이 체크리스트</h1>
    </header>

    <!-- ===== 뷰 1: 펫 목록 ===== -->
    <div id="view-list">
        <div class="pet-add-bar">
            <button class="add-pet-btn cat" onclick="openModal('cat')">🐱 고양이 추가</button>
            <button class="add-pet-btn dog" onclick="openModal('dog')">🐶 강아지 추가</button>
        </div>
        <div id="pet-list-grid" class="pet-grid"></div>
    </div>

    <!-- ===== 뷰 2: 펫 상세 (먹이 체크리스트) ===== -->
    <div id="view-detail" style="display:none;">
        <div class="detail-top">
            <!-- 상단 네비게이션 -->
            <div class="detail-top-nav">
                <button class="back-to-list-btn" onclick="showListView()">← 목록으로</button>
                <button class="detail-settings-btn" onclick="openEditModal(selectedPetId)">⚙️ 설정</button>
            </div>
            <!-- 펫 정보 헤더 -->
            <div class="detail-pet-header">
                <div id="detail-photo-area" class="detail-photo-area" onclick="triggerDetailPhotoUpload()">
                    <div class="photo-edit-overlay">📷</div>
                </div>
                <div>
                    <h2 id="detail-pet-name"></h2>
                    <p id="detail-summary" class="progress-display"></p>
                </div>
            </div>
        </div>

        <!-- 상태 필터 -->
        <div class="status-filter">
            <button class="sfil-btn active" data-status="all"      onclick="setStatusFilter('all')">전체</button>
            <button class="sfil-btn"        data-status="none"     onclick="setStatusFilter('none')">😐 보통</button>
            <button class="sfil-btn"        data-status="favorite" onclick="setStatusFilter('favorite')">❤️ 좋아함</button>
            <button class="sfil-btn"        data-status="dislike"  onclick="setStatusFilter('dislike')">👎 싫어함</button>
            <button class="sfil-btn"        data-status="full"     onclick="setStatusFilter('full')">🍽️ 배불림</button>
        </div>

        <!-- 검색창 -->
        <div class="pet-search-bar">
            <input type="search" id="food-search-input" placeholder="🔍 먹이 이름 검색..." oninput="setFoodSearch(this.value)">
        </div>

        <main id="detail-food-list" class="grid-container"></main>
    </div>

    <!-- ===== 통합 펫 모달 (추가 / 설정) ===== -->
    <div id="pet-modal" class="modal-overlay" style="display:none;" onclick="handleOverlayClick(event)">
        <div class="modal-box">
            <h3 id="modal-title">새 펫 추가</h3>

            <!-- 사진 업로드 영역 -->
            <div class="modal-photo-area" onclick="triggerModalPhotoUpload()">
                <div id="modal-photo-preview" class="modal-photo-preview"></div>
                <div class="photo-edit-overlay">📷</div>
                <button id="modal-photo-remove-btn" class="photo-remove-btn" style="display:none"
                        onclick="event.stopPropagation(); removeModalPhoto()">✕</button>
            </div>

            <!-- 타입 선택 (추가 모드만 표시) -->
            <div id="modal-type-row" class="modal-type-select">
                <button class="type-btn active" id="type-btn-cat" onclick="selectPetType('cat')">🐱 고양이</button>
                <button class="type-btn"        id="type-btn-dog" onclick="selectPetType('dog')">🐶 강아지</button>
            </div>

            <input type="text" id="pet-name-input" placeholder="이름을 입력하세요" maxlength="10">

            <div class="modal-actions">
                <button class="modal-cancel"  onclick="closeModal()">취소</button>
                <button class="modal-confirm" id="modal-confirm-btn" onclick="confirmModal()">추가하기</button>
            </div>
        </div>
    </div>

    <!-- 숨김 파일 입력 -->
    <input type="file" id="photo-upload-input"       accept="image/*" style="display:none" onchange="handlePhotoUpload(event)">
    <input type="file" id="modal-photo-upload-input" accept="image/*" style="display:none" onchange="handleModalPhotoUpload(event)">

    <!-- ===== 사진 라이트박스 ===== -->
    <div id="photo-lightbox" class="lightbox-overlay" style="display:none;" onclick="closeLightbox()">
        <img id="lightbox-img" class="lightbox-img" src="" alt="펫 사진" onclick="event.stopPropagation()">
        <div class="lightbox-actions" onclick="event.stopPropagation()">
            <button class="lightbox-btn lightbox-btn-change" onclick="lightboxChangePhoto()">📷 사진 변경</button>
            <button class="lightbox-btn lightbox-btn-delete" onclick="lightboxDeletePhoto()">🗑️ 사진 삭제</button>
            <button class="lightbox-btn lightbox-btn-close"  onclick="closeLightbox()">✕ 닫기</button>
        </div>
    </div>

    <!-- 토스트 알림 -->
    <div id="toast" class="toast"></div>

    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
    <script src="js/firebase.js"></script>
    <script src="js/auth-ui.js"></script>
    <script src="js/profile-ui.js"></script>
    <script src="js/pet.js"></script>
    <script src="js/theme.js"></script>
    <script src="js/cursor-effects.js"></script>
</body>
</html>
