<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>펫 먹이 체크리스트 - 두근두근타운</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Gamja+Flower&display=swap" rel="stylesheet">
    <style>
        @font-face {
            font-family: 'GanaChocolate';
            src: url('https://fastly.jsdelivr.net/gh/projectnoonnu/noonfonts_20-04@1.0/GanaChocolate.woff') format('woff');
            font-weight: normal;
            font-style: normal;
        }
        @font-face {
            font-family: 'NanumSquareRound';
            src: url('https://fastly.jsdelivr.net/gh/projectnoonnu/noonfonts_two@1.0/NanumSquareRound.woff') format('woff');
            font-weight: normal;
            font-style: normal;
        }
    </style>
</head>

<body>
    <header>
        <a href="index.html" class="back-btn">← 홈으로</a>
        <h1>🐾 펫 먹이 체크리스트</h1>

        <div class="filter-section">
            <div class="category-controls" style="margin-top: 15px;">
                <button class="cat-btn active" data-type="all" onclick="setPetCategory('all')">전체</button>
                <button class="cat-btn" data-type="cat_food" onclick="setPetCategory('cat_food')">🐱 고양이</button>
                <button class="cat-btn" data-type="dog_food" onclick="setPetCategory('dog_food')">🐶 강아지</button>
            </div>

            <div id="pet-progress" class="progress-display"></div>

            <div class="hide-settings" style="margin-top: 15px; text-align: center;">
                <label style="cursor: pointer; font-size: 0.9rem; color: #666;">
                    <input type="checkbox" id="hide-checked-checkbox" onchange="toggleHideChecked(this.checked)">
                    ✅ 수집 완료한 카드 가리기
                </label>
            </div>
        </div>
    </header>

    <main id="item-list" class="grid-container"></main>

    <script src="js/pet.js"></script>
</body>
</html>
